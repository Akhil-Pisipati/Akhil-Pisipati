<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340" role="img" aria-label="Akhil Pisipati banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="leftBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b10"/>
      <stop offset="0.7" stop-color="#220c13"/>
      <stop offset="1" stop-color="#0b0507"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3C4CB"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3121F" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#B3121F" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B3121F" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- backgrounds -->
  <rect width="1060" height="340" fill="#000"/>
  <rect width="560" height="340" fill="url(#leftBg)"/>
  <rect x="560" width="500" height="340" fill="#000"/>
  <rect x="560" width="500" height="340" fill="url(#dots)"/>

  <!-- floating slabs -->
  <polygon points="590,170 700,148 690,240 582,250" fill="url(#slab)" fill-opacity="0.55"/>
  <polygon points="700,0 790,0 745,150 660,160" fill="url(#slab)"/>
  <polygon points="810,0 940,0 880,170 790,170" fill="url(#slab)" fill-opacity="0.8"/>
  <polygon points="930,0 1040,0 990,120 905,120" fill="url(#slab)" fill-opacity="0.6"/>

  <!-- accents -->
  <circle cx="836" cy="266" r="6" fill="#E01E37">
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <polygon points="72,100 77,105 72,110 67,105" fill="#E01E37"/>

  <!-- text -->
  <text x="70" y="176" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="3" fill="url(#nameFill)">AKHIL PISIPATI</text>
  <polygon points="76,200 82,206 76,212 70,206" fill="#E01E37"/>
  <text x="96" y="212" font-family="'Courier New', Consolas, monospace" font-size="18" letter-spacing="2.5" fill="#E01E37">CSE UNDERGRAD · COIMBATORE, INDIA</text>
  <text x="70" y="244" font-family="'Courier New', Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#9A8E92">AMRITA VISHWA VIDYAPEETHAM · FINTECH &amp; DATA/AI · CHASING GSoC</text>
  <rect x="70" y="262" width="230" height="3" fill="#E01E37"/>

  <!-- bottom edge -->
  <rect y="337" width="1060" height="3" fill="#B3121F"/>
</svg>
